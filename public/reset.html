<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Nueva contraseña · Pickazo MX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0f13;--panel:#15171d;--panel2:#1b1e26;--txt:#eceef4;
  --dim:#8d93a3;--dim2:#5f6474;--line:#252935;--red:#ec3013;--green:#22c55e}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:Archivo,system-ui,sans-serif;
  min-height:100vh;display:grid;place-items:center;padding:22px;
  -webkit-font-smoothing:antialiased}
.box{width:100%;max-width:390px}
.brand{display:flex;align-items:center;gap:9px;justify-content:center;margin-bottom:24px;
  font-weight:900;font-size:17px;letter-spacing:-.3px}
.mark{width:28px;height:28px;background:var(--red);display:grid;place-items:center;
  font-size:14px;font-weight:900;color:#fff;border-radius:6px}
.brand span{color:var(--red)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:26px}
h1{font-weight:900;font-size:22px;letter-spacing:-.03em;margin-bottom:5px}
.sub{color:var(--dim);font-size:13.5px;line-height:1.5;margin-bottom:19px}
label{display:block;font-size:9.5px;font-weight:800;letter-spacing:.11em;
  text-transform:uppercase;color:var(--dim2);margin-bottom:5px}
input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--txt);
  padding:11px 12px;border-radius:7px;font-family:inherit;font-size:15px;margin-bottom:12px}
input:focus{outline:none;border-color:var(--red)}
.btn{width:100%;background:var(--red);color:#fff;border:none;border-radius:8px;
  padding:13px;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer;transition:.15s}
.btn:hover:not(:disabled){background:#ff4a2a}
.btn:disabled{opacity:.55;cursor:default}
.msg{font-size:12.5px;font-weight:600;min-height:16px;margin-bottom:10px;color:var(--red)}
.hint{font-size:12px;color:var(--dim2);margin-top:12px;line-height:1.5}
.state{text-align:center;padding:12px 0}
.state .ico{width:46px;height:46px;border-radius:50%;margin:0 auto 15px;display:grid;
  place-items:center;font-size:22px;font-weight:900}
.ico.ok{background:rgba(34,197,94,.14);color:var(--green)}
.ico.bad{background:rgba(236,48,19,.14);color:var(--red)}
.state h2{font-weight:800;font-size:18px;margin-bottom:6px}
.state p{color:var(--dim);font-size:13.5px;line-height:1.55;margin-bottom:18px}
.link{display:inline-block;color:var(--red);font-weight:700;font-size:13.5px;text-decoration:none}
.bar{height:3px;background:var(--panel2);border-radius:2px;margin:-4px 0 12px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--red);transition:width .25s,background .25s}
.foot{text-align:center;font-size:11px;color:var(--dim2);margin-top:20px}
</style>
</head>
<body>
<div class="box">
  <div class="brand"><span class="mark">P</span>PICKAZO <span>MX</span></div>
  <div class="card" id="card">
    <div class="state"><p style="margin:0">Verificando el enlace…</p></div>
  </div>
  <div class="foot">Pickazo MX · Juega con responsabilidad · +18</div>
</div>

<script>
const $=s=>document.querySelector(s);
const token=new URLSearchParams(location.search).get("token")||"";

function vistaError(msg){
  $("#card").innerHTML=`<div class="state">
    <div class="ico bad">!</div>
    <h2>Ese enlace ya no sirve</h2>
    <p>${msg}</p>
    <a class="link" href="/">Volver e intentar de nuevo</a>
  </div>`;
}
function vistaOk(){
  $("#card").innerHTML=`<div class="state">
    <div class="ico ok">✓</div>
    <h2>Listo, contraseña cambiada</h2>
    <p>Ya puedes entrar con tu nueva contraseña.</p>
    <a class="link" href="/">Ir a Pickazo</a>
  </div>`;
}
function vistaForm(min){
  $("#card").innerHTML=`
    <h1>Elige tu nueva contraseña</h1>
    <p class="sub">El enlace vence en ${min} minuto${min===1?"":"s"} y sirve una sola vez.</p>
    <div class="msg" id="msg"></div>
    <label>Nueva contraseña</label>
    <input type="password" id="p1" placeholder="Mínimo 8 caracteres" autocomplete="new-password">
    <div class="bar"><i id="bar"></i></div>
    <label>Repítela</label>
    <input type="password" id="p2" placeholder="La misma otra vez" autocomplete="new-password">
    <button class="btn" id="go">Guardar contraseña</button>
    <p class="hint">Al guardarla iniciamos tu sesión automáticamente.</p>`;

  const p1=$("#p1"),p2=$("#p2");
  p1.addEventListener("input",()=>{
    const v=p1.value,b=$("#bar");
    let f=0;
    if(v.length>=8)f++;
    if(/[A-Z]/.test(v)||/[^a-zA-Z0-9]/.test(v))f++;
    if(/[0-9]/.test(v))f++;
    if(v.length>=12)f++;
    const w=[0,30,55,78,100][Math.min(f,4)];
    b.style.width=w+"%";
    b.style.background=f<=1?"#ec3013":f===2?"#f0b429":"#22c55e";
  });
  [p1,p2].forEach(i=>i.addEventListener("keydown",e=>{if(e.key==="Enter")$("#go").click();}));
  setTimeout(()=>p1.focus(),80);

  $("#go").onclick=async()=>{
    const a=p1.value,b=p2.value,m=$("#msg");
    if(a.length<8){m.textContent="La contraseña necesita al menos 8 caracteres.";return;}
    if(a!==b){m.textContent="Las dos contraseñas no coinciden.";return;}
    m.textContent="";
    $("#go").disabled=true;$("#go").textContent="Guardando…";
    try{
      const r=await fetch("/api/auth/reset",{method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({token,password:a})});
      const d=await r.json().catch(()=>({}));
      if(!r.ok){m.textContent=d.error||"No se pudo cambiar.";
        $("#go").disabled=false;$("#go").textContent="Guardar contraseña";return;}
      if(d.token){localStorage.setItem("token",d.token);
        localStorage.setItem("me",JSON.stringify(d.user));}
      vistaOk();
      setTimeout(()=>location.href="/",2200);
    }catch{
      m.textContent="Sin conexión. Intenta de nuevo.";
      $("#go").disabled=false;$("#go").textContent="Guardar contraseña";
    }
  };
}

(async()=>{
  if(!token){vistaError("El enlace está incompleto. Pide uno nuevo desde la pantalla de entrada.");return;}
  try{
    const r=await fetch(`/api/auth/reset/check?token=${encodeURIComponent(token)}`);
    const d=await r.json().catch(()=>({}));
    if(!r.ok||!d.valido){
      vistaError(d.error==="El enlace venció o ya se usó"
        ? "Los enlaces vencen a los 30 minutos y solo funcionan una vez. Pide uno nuevo."
        : "Pide uno nuevo desde la pantalla de entrada.");
      return;
    }
    vistaForm(d.minutosRestantes ?? 30);
  }catch{
    vistaError("No pudimos verificar el enlace. Revisa tu conexión.");
  }
})();
</script>
</body>
</html>
