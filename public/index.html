<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liga MX · Picks de Valor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0b0f; --panel:#12141c; --panel2:#171a24;
    --line:#242838; --txt:#e8ebf5; --dim:#8b90a5;
    --green:#00e676; --amber:#ffb300; --red:#ff4d4d;
    --gold:#ffd54a; --accent:#3d7bff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:'Archivo',sans-serif;
    -webkit-font-smoothing:antialiased;padding-bottom:60px}
  .mono{font-family:'JetBrains Mono',monospace}
  header{border-bottom:1px solid var(--line);padding:16px 20px;
    display:flex;justify-content:space-between;align-items:center;
    position:sticky;top:0;background:rgba(10,11,15,.92);backdrop-filter:blur(8px);z-index:10}
  .logo{font-weight:900;font-size:19px;letter-spacing:-.5px}
  .logo span{color:var(--green)}
  .auth-btns button{background:none;border:1px solid var(--line);color:var(--txt);
    padding:7px 14px;border-radius:7px;font-family:inherit;font-weight:600;
    cursor:pointer;font-size:13px;margin-left:8px}
  .auth-btns button:hover{border-color:var(--green)}
  .btn-pro{background:var(--gold)!important;color:#000!important;border:none!important}
  main{max-width:820px;margin:0 auto;padding:20px}

  /* PEOPLE'S CHOICE — la pieza central */
  .peoples{background:linear-gradient(135deg,#1a1206,#12141c);
    border:1px solid var(--gold);border-radius:16px;padding:24px;margin-bottom:28px;
    position:relative;overflow:hidden}
  .peoples::before{content:"";position:absolute;top:-40%;right:-10%;width:200px;height:200px;
    background:radial-gradient(circle,rgba(255,213,74,.14),transparent 70%)}
  .pc-eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:3px;
    text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px}
  .pc-match{font-size:26px;font-weight:900;letter-spacing:-.8px;line-height:1.05;margin-bottom:6px}
  .pc-market{color:var(--dim);font-size:15px;margin-bottom:16px}
  .pc-stats{display:flex;gap:22px;flex-wrap:wrap}
  .pc-stat .k{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
  .pc-stat .v{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;margin-top:2px}
  .pc-votes{color:var(--gold)}

  .section-label{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:2px;
    text-transform:uppercase;color:var(--dim);margin:22px 0 12px;display:flex;
    align-items:center;gap:10px}
  .section-label::after{content:"";flex:1;height:1px;background:var(--line)}

  .pick{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:18px;margin-bottom:12px;transition:border-color .15s}
  .pick:hover{border-color:#333a52}
  .pick-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .pick-match{font-size:18px;font-weight:800;letter-spacing:-.3px}
  .pick-market{color:var(--dim);font-size:14px;margin-top:2px}
  .verdict{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;
    padding:4px 9px;border-radius:6px;white-space:nowrap}
  .v-MANDAR{background:rgba(0,230,118,.13);color:var(--green)}
  .v-RESERVAS{background:rgba(255,179,0,.13);color:var(--amber)}
  .pick-metrics{display:flex;gap:20px;margin-top:14px;flex-wrap:wrap}
  .metric .k{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
  .metric .v{font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:700;margin-top:1px}
  .edge-pos{color:var(--green)}
  .pick-foot{display:flex;justify-content:space-between;align-items:center;
    margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .vote-btn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    padding:8px 16px;border-radius:8px;font-family:'JetBrains Mono',monospace;
    font-weight:700;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:8px}
  .vote-btn:hover:not(:disabled){border-color:var(--green);color:var(--green)}
  .vote-btn:disabled{opacity:.5;cursor:not-allowed}
  .vote-count{color:var(--gold);font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px}

  .pro-lock{background:var(--panel);border:1px dashed var(--line);border-radius:12px;
    padding:28px;text-align:center;color:var(--dim)}
  .pro-lock strong{color:var(--gold);display:block;font-size:16px;margin-bottom:6px}
  .pro-lock button{margin-top:14px;background:var(--gold);color:#000;border:none;
    padding:10px 20px;border-radius:8px;font-weight:800;cursor:pointer;font-family:inherit}

  /* Modal */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;
    align-items:center;justify-content:center;z-index:50;padding:20px}
  .modal.show{display:flex}
  .modal-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:26px;width:100%;max-width:360px}
  .modal-box h3{font-size:20px;font-weight:900;margin-bottom:16px}
  .modal-box input{width:100%;background:var(--bg);border:1px solid var(--line);
    color:var(--txt);padding:11px 13px;border-radius:8px;font-family:inherit;
    margin-bottom:10px;font-size:14px}
  .modal-box input:focus{outline:none;border-color:var(--green)}
  .modal-box .primary{width:100%;background:var(--green);color:#000;border:none;
    padding:12px;border-radius:8px;font-weight:800;cursor:pointer;font-family:inherit;margin-top:6px}
  .modal-switch{text-align:center;color:var(--dim);font-size:13px;margin-top:14px;cursor:pointer}
  .modal-switch b{color:var(--green)}
  .err{color:var(--red);font-size:13px;margin-bottom:8px;min-height:16px}
  .empty{text-align:center;color:var(--dim);padding:40px 20px;font-size:14px}

  .parlay{background:linear-gradient(135deg,#0d1420,#12141c);
    border:1px solid var(--accent);border-radius:14px;padding:20px;margin-bottom:14px}
  .parlay-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .parlay-tag{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:2px;
    text-transform:uppercase;color:var(--accent);font-weight:700}
  .parlay-momio{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:700;color:var(--green)}
  .leg{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
  .leg:last-of-type{border-bottom:none}
  .leg-info b{font-weight:700}
  .leg-info span{color:var(--dim);display:block;font-size:12px;margin-top:1px}
  .leg-momio{font-family:'JetBrains Mono',monospace;color:var(--dim)}
  .parlay-ia{background:rgba(61,123,255,.08);border-radius:8px;padding:12px;margin-top:14px;
    font-size:13px;line-height:1.5;color:var(--txt)}
  .parlay-ia .vd{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--accent);
    display:block;margin-bottom:5px;font-size:11px;letter-spacing:1px}
  .parlay-metrics{display:flex;gap:18px;margin-top:12px}
  .parlay-metrics .k{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim);text-transform:uppercase}
  .parlay-metrics .v{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700}
</style>
</head>
<body>
<header>
  <div class="logo">LIGA <span>MX</span> · VALOR</div>
  <div class="auth-btns" id="authArea"></div>
</header>

<main>
  <div id="peoplesChoice"></div>

  <div class="section-label">Top 3 · Picks del día</div>
  <div id="publicPicks"><div class="empty">Cargando…</div></div>

  <div class="section-label">Picks PRO</div>
  <div id="proPicks"></div>

  <div class="section-label">⚡ Parlays IA</div>
  <div id="publicParlay"></div>
  <div id="proParlays"></div>
</main>

<div class="modal" id="authModal">
  <div class="modal-box">
    <h3 id="modalTitle">Entrar</h3>
    <div class="err" id="modalErr"></div>
    <input type="email" id="mEmail" placeholder="correo@ejemplo.com" autocomplete="email">
    <input type="password" id="mPass" placeholder="contraseña (mín. 8)" autocomplete="current-password">
    <button class="primary" id="mSubmit">Entrar</button>
    <div class="modal-switch" id="mSwitch">¿No tienes cuenta? <b>Regístrate</b></div>
  </div>
</div>

<script>
const API = "/api";
let token = localStorage.getItem("token");
let me = JSON.parse(localStorage.getItem("me") || "null");
let mode = "login";

const $ = (s) => document.querySelector(s);
const money = (n) => Number(n).toFixed(2);
const pct = (n) => (Number(n) * 100).toFixed(1) + "%";

function headers() {
  const h = { "Content-Type": "application/json" };
  if (token) h.Authorization = "Bearer " + token;
  return h;
}

function renderAuth() {
  const a = $("#authArea");
  if (me) {
    a.innerHTML = `
      ${me.isPro ? "" : '<button class="btn-pro" onclick="goPro()">Hazte PRO</button>'}
      <button onclick="logout()">Salir</button>`;
  } else {
    a.innerHTML = `<button onclick="openAuth('login')">Entrar</button>
      <button class="btn-pro" onclick="openAuth('register')">Crear cuenta</button>`;
  }
}

function pickCard(p, canVote) {
  const votedKey = "voted_" + p._id;
  const voted = localStorage.getItem(votedKey);
  return `
    <div class="pick">
      <div class="pick-top">
        <div>
          <div class="pick-match">${p.partido}</div>
          <div class="pick-market">${p.mercado}</div>
        </div>
        <div class="verdict v-${p.verdicto}">${p.verdicto}</div>
      </div>
      <div class="pick-metrics">
        <div class="metric"><div class="k">Momio</div><div class="v">${money(p.momio)}</div></div>
        <div class="metric"><div class="k">Prob. est.</div><div class="v">${pct(p.probEstimada)}</div></div>
        <div class="metric"><div class="k">Edge</div><div class="v edge-pos">+${pct(p.edge)}</div></div>
      </div>
      ${p.analisis ? `<p style="color:var(--dim);font-size:14px;margin-top:12px;line-height:1.5">${p.analisis}</p>` : ""}
      <div class="pick-foot">
        <span class="vote-count">▲ ${p.votos} votos</span>
        <button class="vote-btn" ${voted || !canVote ? "disabled" : ""}
          onclick="vote('${p._id}',this)">
          ${voted ? "✓ Votaste" : canVote ? "Votar" : "Inicia sesión"}
        </button>
      </div>
    </div>`;
}

async function loadPeoplesChoice() {
  const r = await fetch(`${API}/picks/peoples-choice`);
  const p = await r.json();
  const el = $("#peoplesChoice");
  if (!p) { el.innerHTML = ""; return; }
  el.innerHTML = `
    <div class="peoples">
      <div class="pc-eyebrow">★ People's Choice</div>
      <div class="pc-match">${p.partido}</div>
      <div class="pc-market">${p.mercado}</div>
      <div class="pc-stats">
        <div class="pc-stat"><div class="k">Momio</div><div class="v">${money(p.momio)}</div></div>
        <div class="pc-stat"><div class="k">Edge</div><div class="v edge-pos">+${pct(p.edge)}</div></div>
        <div class="pc-stat"><div class="k">Votos</div><div class="v pc-votes">${p.votos}</div></div>
      </div>
    </div>`;
}

async function loadPublic() {
  const r = await fetch(`${API}/picks/public`);
  const picks = await r.json();
  $("#publicPicks").innerHTML = picks.length
    ? picks.map((p) => pickCard(p, !!me)).join("")
    : '<div class="empty">Aún no hay picks públicos hoy</div>';
}

async function loadPro() {
  const el = $("#proPicks");
  if (!me) {
    el.innerHTML = `<div class="pro-lock"><strong>Contenido PRO</strong>
      Inicia sesión y hazte PRO para ver los picks exclusivos.</div>`;
    return;
  }
  if (!me.isPro) {
    el.innerHTML = `<div class="pro-lock"><strong>Contenido PRO</strong>
      Los picks de mayor valor están reservados para suscriptores.
      <button onclick="goPro()">Hazte PRO</button></div>`;
    return;
  }
  const r = await fetch(`${API}/picks/pro`, { headers: headers() });
  if (r.status === 403) {
    el.innerHTML = `<div class="pro-lock"><strong>Tu PRO venció</strong>
      <button onclick="goPro()">Renovar</button></div>`;
    me.isPro = false; localStorage.setItem("me", JSON.stringify(me)); renderAuth();
    return;
  }
  const picks = await r.json();
  el.innerHTML = picks.length
    ? picks.map((p) => pickCard(p, true)).join("")
    : '<div class="empty">Aún no hay picks PRO hoy</div>';
}

async function vote(id, btn) {
  if (!me) return openAuth("login");
  btn.disabled = true;
  const r = await fetch(`${API}/picks/${id}/vote`, { method: "POST", headers: headers() });
  const d = await r.json();
  if (r.ok) {
    localStorage.setItem("voted_" + id, "1");
    btn.textContent = "✓ Votaste";
    loadPeoplesChoice();
    loadPublic();
    loadPro();
  } else {
    if (r.status === 409) { localStorage.setItem("voted_" + id, "1"); btn.textContent = "✓ Votaste"; }
    else { btn.disabled = false; alert(d.error); }
  }
}

async function goPro() {
  if (!me) return openAuth("login");
  const r = await fetch(`${API}/payments/checkout`, { method: "POST", headers: headers() });
  const d = await r.json();
  if (d.url) location.href = d.url;
}

// --- Auth modal ---
function openAuth(m) {
  mode = m;
  $("#modalTitle").textContent = m === "login" ? "Entrar" : "Crear cuenta";
  $("#mSubmit").textContent = m === "login" ? "Entrar" : "Registrarme";
  $("#mSwitch").innerHTML = m === "login"
    ? '¿No tienes cuenta? <b>Regístrate</b>'
    : '¿Ya tienes cuenta? <b>Entra</b>';
  $("#modalErr").textContent = "";
  $("#authModal").classList.add("show");
}
$("#mSwitch").onclick = () => openAuth(mode === "login" ? "register" : "login");
$("#authModal").onclick = (e) => { if (e.target.id === "authModal") $("#authModal").classList.remove("show"); };

$("#mSubmit").onclick = async () => {
  const email = $("#mEmail").value.trim();
  const password = $("#mPass").value;
  const r = await fetch(`${API}/auth/${mode}`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password })
  });
  const d = await r.json();
  if (!r.ok) { $("#modalErr").textContent = d.error; return; }
  token = d.token; me = d.user;
  localStorage.setItem("token", token);
  localStorage.setItem("me", JSON.stringify(me));
  $("#authModal").classList.remove("show");
  renderAuth(); loadPublic(); loadPro(); loadProParlays();
};

function logout() {
  token = null; me = null;
  localStorage.removeItem("token"); localStorage.removeItem("me");
  renderAuth(); loadPublic(); loadPro(); loadProParlays();
}

function parlayCard(pl, tag) {
  const legs = pl.patas.map((p) => `
    <div class="leg">
      <div class="leg-info"><b>${p.partido}</b><span>${p.mercado}</span></div>
      <div class="leg-momio">${money(p.momio)}</div>
    </div>`).join("");
  return `
    <div class="parlay">
      <div class="parlay-head">
        <span class="parlay-tag">${tag} · ${pl.patas.length} patas</span>
        <span class="parlay-momio">${money(pl.momioComb)}</span>
      </div>
      ${legs}
      <div class="parlay-metrics">
        <div><div class="k">Prob. conjunta</div><div class="v">${pct(pl.probConjunta)}</div></div>
        <div><div class="k">Edge</div><div class="v edge-pos">+${pct(pl.edge)}</div></div>
      </div>
      ${pl.analisisIA ? `<div class="parlay-ia">
        ${pl.veredicto ? `<span class="vd">▸ ${pl.veredicto}</span>` : ""}
        ${pl.analisisIA}</div>` : ""}
    </div>`;
}

async function loadPublicParlay() {
  const r = await fetch(`${API}/parlays/public`);
  const list = await r.json();
  $("#publicParlay").innerHTML = list.length
    ? list.map((pl) => parlayCard(pl, "Parlay del día")).join("")
    : '<div class="empty">Aún no hay parlay del día</div>';
}

async function loadProParlays() {
  const el = $("#proParlays");
  if (!me || !me.isPro) { el.innerHTML = ""; return; }
  const r = await fetch(`${API}/parlays/pro`, { headers: headers() });
  if (!r.ok) { el.innerHTML = ""; return; }
  const list = await r.json();
  el.innerHTML = list.map((pl) => parlayCard(pl, "Parlay PRO")).join("");
}

// Init
renderAuth();
loadPeoplesChoice();
loadPublic();
loadPro();
loadPublicParlay();
loadProParlays();
</script>
</body>
</html>
