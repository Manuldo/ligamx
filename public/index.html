<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pickazo MX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0f13; --panel:#15171d; --panel2:#1b1e26; --panel3:#232733;
  --txt:#eceef4; --dim:#8d93a3; --dim2:#5f6474; --line:#252935;
  --red:#ec3013; --red-dk:#c4260c;
  --green:#22c55e; --amber:#f0b429; --blue:#3b82f6;
  --sbw:230px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:Archivo,system-ui,sans-serif;
  font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer}
.hide{display:none!important}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--panel3);border-radius:4px}

/* ===== SIDEBAR ===== */
aside{position:fixed;top:0;left:0;bottom:0;width:var(--sbw);background:var(--panel);
  border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:50;
  transition:width .22s cubic-bezier(.4,0,.2,1)}
body.collapsed aside{width:62px}
.sb-top{display:flex;align-items:center;gap:10px;padding:16px 14px;border-bottom:1px solid var(--line)}
.sb-logo{display:flex;align-items:center;gap:9px;font-weight:900;font-size:16px;
  letter-spacing:-.4px;white-space:nowrap;overflow:hidden}
.sb-mark{width:28px;height:28px;background:var(--red);flex-shrink:0;
  display:grid;place-items:center;font-size:14px;font-weight:900;color:#fff}
.sb-logo span{color:var(--red)}
body.collapsed .sb-logo em,body.collapsed .sb-logo span{display:none}
.sb-toggle{margin-left:auto;background:none;border:none;color:var(--dim);
  width:26px;height:26px;display:grid;place-items:center;flex-shrink:0;border-radius:5px}
.sb-toggle:hover{background:var(--panel3);color:var(--txt)}
body.collapsed .sb-toggle{margin-left:0}

.sb-nav{flex:1;padding:12px 8px;overflow-y:auto;overflow-x:hidden}
.sb-sec{font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim2);padding:12px 10px 6px;white-space:nowrap}
body.collapsed .sb-sec{opacity:0;height:14px;padding:6px}
.sb-item{display:flex;align-items:center;gap:11px;width:100%;background:none;border:none;
  color:var(--dim);padding:9px 10px;font-weight:600;font-size:14px;text-align:left;
  border-radius:7px;white-space:nowrap;overflow:hidden}
.sb-item:hover{background:var(--panel2);color:var(--txt)}
.sb-item.on{background:var(--panel3);color:var(--txt)}
.sb-item.on .ic{color:var(--red)}
.ic{width:19px;flex-shrink:0;display:grid;place-items:center;font-size:15px}
body.collapsed .sb-item span{display:none}
.sb-bot{padding:12px 8px;border-top:1px solid var(--line)}
.sb-user{display:flex;align-items:center;gap:10px;padding:8px 10px;overflow:hidden}
.av{width:28px;height:28px;background:var(--panel3);flex-shrink:0;display:grid;
  place-items:center;font-weight:800;font-size:12px;color:var(--txt)}
.sb-user-i{min-width:0;white-space:nowrap;overflow:hidden}
.sb-user-i b{display:block;font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis}
.sb-user-i em{font-style:normal;font-size:10.5px;color:var(--red);font-weight:800;letter-spacing:.06em}
body.collapsed .sb-user-i{display:none}

/* ===== MAIN ===== */
.wrap{margin-left:var(--sbw);transition:margin-left .22s cubic-bezier(.4,0,.2,1);min-height:100vh}
body.collapsed .wrap{margin-left:62px}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;
  padding:13px 24px;background:rgba(14,15,19,.9);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)}
.tb-t{font-weight:800;font-size:16.5px;letter-spacing:-.2px}
.tb-s{font-size:12px;color:var(--dim);margin-right:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;
  font-size:13px;padding:7px 13px;border:1px solid transparent;border-radius:6px;transition:.15s}
.btn-red{background:var(--red);color:#fff}.btn-red:hover{background:var(--red-dk)}
.btn-line{background:transparent;color:var(--dim);border-color:var(--line)}
.btn-line:hover{color:var(--txt);border-color:var(--dim2)}
.page{padding:22px 24px 60px;max-width:1180px}

/* ===== CARDS ===== */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.card-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.card-t{font-weight:800;font-size:14.5px;letter-spacing:-.1px}
.card-s{font-size:11.5px;color:var(--dim);margin-left:auto}
.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;align-items:start}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}}

/* ===== ESCUDOS (iniciales) ===== */
.crest{width:22px;height:22px;border-radius:4px;display:grid;place-items:center;
  font-size:8.5px;font-weight:900;color:#fff;flex-shrink:0;letter-spacing:-.2px}
.crest.lg{width:30px;height:30px;font-size:10.5px;border-radius:6px}

/* ===== TABLA ===== */
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim2);text-align:right;padding:9px 6px;border-bottom:1px solid var(--line)}
th:nth-child(1),th:nth-child(2){text-align:left}
td{padding:8px 6px;border-bottom:1px solid rgba(37,41,53,.55);text-align:right}
td:nth-child(1),td:nth-child(2){text-align:left}
tbody tr:hover{background:var(--panel2)}
.pos{font-weight:700;color:var(--dim);width:24px}
.tm{display:flex;align-items:center;gap:9px;font-weight:600}
.zone{border-left:2px solid transparent}
.z-liguilla{border-left-color:var(--green)}
.z-play{border-left-color:var(--amber)}
.pts{font-weight:800;color:var(--txt)}
.forma{display:flex;gap:2.5px;justify-content:flex-end}
.fm{width:15px;height:15px;border-radius:3px;display:grid;place-items:center;
  font-size:8.5px;font-weight:800;color:#fff}
.fm-G{background:var(--green)}.fm-P{background:var(--red)}.fm-E{background:var(--dim2)}

/* ===== JORNADA ===== */
.jday{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  color:var(--dim);padding:10px 16px 6px;background:var(--panel2)}
.jm{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid rgba(37,41,53,.5)}
.jm:hover{background:var(--panel2)}
.jm-side{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.jm-side.r{justify-content:flex-end}
.jm-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jm-mid{font-size:12px;font-weight:800;color:var(--dim);min-width:52px;text-align:center;flex-shrink:0}
.jm-mid.sc{color:var(--txt);font-size:14px}
.jm-an{background:none;border:1px solid var(--line);color:var(--dim);border-radius:5px;
  padding:4px 8px;font-size:11px;font-weight:700;flex-shrink:0}
.jm-an:hover:not(:disabled){border-color:var(--red);color:var(--red)}
.jm-an:disabled{opacity:.4}
/* --- Móvil: fila de partido más legible --- */
@media(max-width:560px){
  .jm{flex-wrap:wrap;gap:8px 10px;padding:12px 14px}
  .jm-side{flex:1 1 40%;min-width:0}
  .jm-name{font-size:13px}
  .jm-mid{order:0;min-width:44px}
  .badge-live,.badge-fin,.badge-hoy,.badge-liga{order:5;flex:0 0 auto}
  .jm-an{order:6;margin-left:auto}
}

/* ===== JUGADORES ===== */
.pfilters{display:flex;gap:6px;padding:11px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pf{background:var(--panel2);border:1px solid var(--line);color:var(--dim);
  border-radius:6px;padding:5px 10px;font-size:11.5px;font-weight:700}
.pf.on{background:var(--red);border-color:var(--red);color:#fff}
.prow{display:flex;align-items:center;gap:11px;padding:10px 16px;border-bottom:1px solid rgba(37,41,53,.5)}
.prow:hover{background:var(--panel2)}
.face{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
  font-size:11px;font-weight:800;color:#fff;position:relative}
.face i{position:absolute;bottom:-2px;right:-3px;width:15px;height:15px;border-radius:3px;
  display:grid;place-items:center;font-size:6.5px;font-weight:900;color:#fff;
  border:1.5px solid var(--panel);font-style:normal}
.pinfo{flex:1;min-width:0}
.pinfo b{display:block;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinfo span{font-size:11px;color:var(--dim)}
.pstat{text-align:right;min-width:42px}
.pstat .v{font-weight:800;font-size:14px}
.pstat .k{font-size:9px;color:var(--dim2);letter-spacing:.08em;text-transform:uppercase}
.bench{font-size:9.5px;font-weight:800;padding:1.5px 5px;border-radius:3px;margin-left:5px}
.b-up{background:rgba(34,197,94,.15);color:var(--green)}
.b-dn{background:rgba(236,48,19,.15);color:var(--red)}

/* ===== PICKS ===== */
.pick{border-bottom:1px solid var(--line);padding:15px 16px}
.pick:last-child{border-bottom:none}
.pick-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pick-m{font-weight:700;font-size:15px}
.pick-k{font-size:12.5px;color:var(--dim);margin-top:1px}
.vd{font-size:9.5px;font-weight:800;letter-spacing:.08em;padding:3px 7px;border-radius:4px}
.vd-MANDAR{background:var(--red);color:#fff}
.vd-RESERVAS{background:var(--panel3);color:var(--dim)}
.vd-EVITAR{background:var(--dim2);color:#fff}
.ebar{height:4px;background:var(--panel3);border-radius:2px;margin-top:11px;overflow:hidden}
.efill{height:100%;background:var(--red);width:0;transition:width .8s cubic-bezier(.22,1,.36,1)}
.enums{display:flex;gap:20px;margin-top:10px}
.en .k{font-size:9px;color:var(--dim2);letter-spacing:.09em;text-transform:uppercase}
.en .v{font-weight:800;font-size:14.5px;margin-top:1px}
.pnote{font-size:12.5px;color:var(--dim);line-height:1.5;margin-top:10px;
  padding-left:9px;border-left:2px solid var(--panel3)}
.pft{display:flex;justify-content:space-between;align-items:center;margin-top:11px;gap:8px;flex-wrap:wrap}
.sm{background:var(--panel2);border:1px solid var(--line);color:var(--dim);border-radius:5px;
  padding:6px 11px;font-size:11.5px;font-weight:700}
.sm:hover:not(:disabled){border-color:var(--red);color:var(--red)}
.sm:disabled{opacity:.45}
.sm.on{background:var(--red);border-color:var(--red);color:#fff}
.lockrow{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.lk-b{flex:1;min-width:0}
.lk-b b{font-size:14px;font-weight:700;color:var(--dim)}
.lk-blur{margin-top:3px;font-size:12px;color:var(--dim2);filter:blur(4px);user-select:none}
.lk-e{text-align:right}
.lk-e .k{font-size:9px;color:var(--dim2);text-transform:uppercase;letter-spacing:.08em}
.lk-e .v{font-weight:800;font-size:15px;color:var(--red)}

/* ===== ALINEACIONES ===== */
.ali-badge{margin-left:auto;font-size:9.5px;font-weight:800;letter-spacing:.07em;padding:3px 9px;border-radius:5px}
.ali-conf{color:var(--green);background:rgba(34,197,94,.13)}
.ali-prob{color:var(--amber);background:rgba(240,180,41,.13)}
.ali-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
@media(max-width:560px){.ali-grid{grid-template-columns:1fr}}
.ali-col{background:var(--panel);padding:12px 14px}
.ali-team{font-weight:800;font-size:13px;margin-bottom:9px;display:flex;align-items:center;gap:7px}
.ali-form{font-size:10px;font-weight:700;color:var(--dim2);background:var(--panel3);padding:2px 6px;border-radius:4px}
.ali-p{display:flex;align-items:center;gap:9px;padding:5px 0;border-bottom:1px solid rgba(37,41,53,.4)}
.ali-p:last-child{border-bottom:none}
.ali-num{width:20px;font-size:11px;color:var(--dim2);text-align:center;flex-shrink:0}
.ali-name{font-size:13px;font-weight:600;flex:1}
.ali-pos{font-size:9.5px;font-weight:700;color:var(--dim2);text-transform:uppercase}
.ali-empty{font-size:12px;color:var(--dim2);padding:8px 0}

/* ===== SELECTOR DE JORNADAS ===== */
.jornada-sel{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;overflow-x:auto;padding-bottom:2px}
.jor-chip{display:inline-flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line);
  color:var(--dim);border-radius:7px;padding:6px 11px;font-size:12px;font-weight:700;white-space:nowrap;flex-shrink:0}
.jor-chip:hover{border-color:var(--dim2);color:var(--txt)}
.jor-chip.on{background:var(--panel3);border-color:var(--dim2);color:var(--txt)}
.jor-dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
.jday{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  color:var(--dim);padding:11px 16px 7px;background:var(--panel2);text-transform:capitalize}

/* ===== MARCADORES EN VIVO + BADGES (idea 1) ===== */
.badge-live{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:800;
  letter-spacing:.06em;color:var(--red);background:rgba(236,48,19,.12);padding:3px 9px;border-radius:5px;flex-shrink:0}
.dot-live{width:6px;height:6px;border-radius:50%;background:var(--red);animation:pulseLive 1.4s infinite}
@keyframes pulseLive{0%{box-shadow:0 0 0 0 rgba(236,48,19,.6)}70%{box-shadow:0 0 0 6px rgba(236,48,19,0)}100%{box-shadow:0 0 0 0 rgba(236,48,19,0)}}
.badge-hoy{font-size:10px;font-weight:800;color:var(--amber);background:rgba(240,180,41,.12);padding:3px 9px;border-radius:5px;flex-shrink:0}
.badge-fin{font-size:10px;font-weight:800;color:var(--dim2);background:var(--panel3);padding:3px 9px;border-radius:5px;flex-shrink:0}
.badge-liga{font-size:9.5px;font-weight:800;color:var(--blue);background:rgba(59,130,246,.12);padding:3px 9px;border-radius:5px;flex-shrink:0;white-space:nowrap}
.jm-min{font-size:10px;color:var(--red);font-weight:800;display:block;text-align:center}
.gol-flash{animation:golFlash 1s ease}
@keyframes golFlash{0%{color:var(--green);transform:scale(1.35)}100%{color:var(--txt);transform:scale(1)}}

/* ===== SELECTOR DE LIGAS ===== */
.liga-sel{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.liga-chip{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);
  color:var(--dim);border-radius:8px;padding:8px 13px;font-size:13px;font-weight:700}
.liga-chip:hover{border-color:var(--dim2);color:var(--txt)}
.liga-chip.on{background:var(--red);border-color:var(--red);color:#fff}
.liga-chip span{font-size:14px}

/* ===== ANALISIS DEL MOTOR ===== */
.an-sec{padding:13px 16px;border-bottom:1px solid var(--line);border-left:3px solid var(--panel3)}
.an-sec-t{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  color:var(--dim);margin-bottom:7px;display:flex;align-items:center;gap:6px}
.an-sec-b{font-size:13px;line-height:1.5;color:var(--txt)}
.an-sec-b b{color:var(--txt)}
.sec-lectura{border-left-color:var(--blue)}
.sec-veredicto{border-left-color:var(--amber);background:linear-gradient(120deg,rgba(240,180,41,.06),transparent)}
.sec-riesgo{border-left-color:var(--red)}
.an-li{padding:5px 0 5px 4px;border-top:1px solid rgba(37,41,53,.5);font-size:12.5px;color:var(--dim)}
.an-li:first-child{border-top:none}
.an-li b{color:var(--txt)}
/* modelos */
.an-model{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
  padding:9px 16px;margin-top:2px}
.an-model-cons{color:var(--green);background:linear-gradient(90deg,rgba(34,197,94,.1),transparent);
  border-left:3px solid var(--green)}
.an-model-esta{color:var(--red);background:linear-gradient(90deg,rgba(236,48,19,.1),transparent);
  border-left:3px solid var(--red)}
/* pick con barra de confianza */
.an-pick{display:flex;gap:13px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:flex-start}
.an-pick-conf{flex-shrink:0;width:52px;text-align:center;padding-top:2px}
.an-pick-conf b{display:block;font-size:19px;font-weight:900;font-family:'JetBrains Mono',monospace;line-height:1}
.an-pick-conf span{font-size:8.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--dim2)}
.an-pick-body{flex:1;min-width:0}
.an-pick-sel{font-weight:700;font-size:14px;margin-bottom:3px}
.an-pick-why{font-size:12.5px;color:var(--dim);line-height:1.45}
.an-pick-bar{height:3px;background:var(--panel3);border-radius:2px;margin-top:8px;overflow:hidden}
.an-pick-bar i{display:block;height:100%;border-radius:2px}
/* colapsables */
.an-collapse{cursor:pointer;user-select:none}
.an-caret{margin-left:auto;transition:transform .2s;color:var(--dim2)}
.an-collapse.closed .an-caret{transform:rotate(-90deg)}
.an-collapse.closed .an-sec-b{display:none}

/* ===== ESTADOS ===== */
.empty{padding:32px 20px;text-align:center}
.empty b{display:block;font-weight:700;font-size:14.5px;margin-bottom:4px}
.empty span{color:var(--dim);font-size:13px;max-width:320px;display:inline-block}
.skel{height:14px;background:var(--panel2);border-radius:4px;margin:9px 16px;
  animation:sh 1.3s infinite;background:linear-gradient(90deg,var(--panel2),var(--panel3),var(--panel2));
  background-size:200% 100%}
@keyframes sh{to{background-position:-200% 0}}
/* ===== LANDING (sin sesión) ===== */
body.landing aside,body.landing .topbar{display:none}
body.landing .wrap{margin-left:0}
body.landing .page{padding:0;max-width:none}
.land{position:relative;min-height:100vh;display:flex;align-items:center;
  justify-content:center;padding:56px 22px;background:#14120f;overflow:hidden}
.land-vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  filter:grayscale(1) brightness(.5);z-index:0}
.land-bg{position:absolute;inset:0;pointer-events:none;z-index:1;
  background:
    radial-gradient(ellipse 70% 55% at 50% 0%,rgba(236,48,19,.20),transparent 62%),
    linear-gradient(180deg,rgba(20,18,15,.55),rgba(20,18,15,.88)),
    repeating-linear-gradient(115deg,rgba(255,255,255,.018) 0 2px,transparent 2px 5px)}
.land-bg::after{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px);
  opacity:.45}
/* Si el usuario pide menos movimiento, el video no se reproduce */
@media(prefers-reduced-motion:reduce){.land-vid{display:none}}
.land-in{position:relative;z-index:2;max-width:560px;width:100%;text-align:center}
.land-badge{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;color:#cfcac6;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:7px 16px;margin-bottom:22px}
.land-badge .d{width:6px;height:6px;border-radius:50%;background:var(--red);
  animation:beat 2.2s infinite}
@keyframes beat{0%,100%{opacity:1}50%{opacity:.3}}
.land-h1{font-weight:900;font-size:clamp(29px,5vw,46px);line-height:1.06;
  letter-spacing:-.03em;color:#f3f2f2;margin-bottom:18px}
.land-p{color:#b7b2ae;font-size:15.5px;line-height:1.6;margin-bottom:32px}
.land-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:30px;text-align:left}
.lc{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);
  border-radius:12px;padding:16px;transition:background .18s}
.lc:hover{background:rgba(255,255,255,.08)}
.lc b{display:block;font-weight:800;font-size:14px;color:#f3f2f2;margin-bottom:4px}

<script>
const API="/api";
let token=localStorage.getItem("token");
let me=JSON.parse(localStorage.getItem("me")||"null");
let view="hoy", mode="login";
const cache={};
// Ligas disponibles (el motor las tiene). El selector deja cambiar.
let LIGA_ACTUAL="ligamx";
const LIGA_NOMBRES={ligamx:"Liga MX",premier:"Premier League",laliga:"LaLiga",
  seriea:"Serie A",bundesliga:"Bundesliga",ligue1:"Ligue 1"};
const LIGA_FLAGS={ligamx:"🇲🇽",premier:"🏴",laliga:"🇪🇸",seriea:"🇮🇹",bundesliga:"🇩🇪",ligue1:"🇫🇷"};
function ligaSelectorHTML(){
  return `<div class="liga-sel">
    <button class="liga-chip ${LIGA_ACTUAL==="__todas__"?"on":""}" data-liga="__todas__"><span>🌍</span> Todas</button>
    ${Object.keys(LIGA_NOMBRES).map(k=>
    `<button class="liga-chip ${LIGA_ACTUAL===k?"on":""}" data-liga="${k}">
      <span>${LIGA_FLAGS[k]||"⚽"}</span> ${LIGA_NOMBRES[k]}</button>`).join("")}</div>`;
}

const $=s=>document.querySelector(s);
const dec=n=>Number(n).toFixed(2);
// Fecha YYYY-MM-DD en horario de Ciudad de México (para comparar "hoy" bien)
const TZ="America/Mexico_City";
function fechaMX(d){
  // devuelve "YYYY-MM-DD" del Date d en horario de México
  const s=new Date(d).toLocaleDateString("en-CA",{timeZone:TZ}); // en-CA da formato YYYY-MM-DD
  return s;
}
const hoyMX=()=>fechaMX(new Date());
const pct=n=>(Number(n)*100).toFixed(1)+"%";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const H=()=>{const h={"Content-Type":"application/json"};if(token)h.Authorization="Bearer "+token;return h;};
const isPro=()=>!!(me&&me.isPro);

function toast(m,k){const t=$("#toast");t.textContent=m;t.className="toast on "+(k||"");
  clearTimeout(t._t);t._t=setTimeout(()=>t.className="toast "+(k||""),2600);}

// color estable por nombre de equipo
function teamColor(n){
  let h=0;for(let i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))>>>0;
  const pal=["#ec3013","#2563eb","#059669","#d97706","#7c3aed","#0891b2","#be123c","#4d7c0f","#9333ea","#0369a1"];
  return pal[h%pal.length];
}
const ab=n=>String(n).replace(/[^A-Za-zÁÉÍÓÚÑáéíóúñ ]/g,"").split(" ")
  .filter(Boolean).map(w=>w[0]).join("").slice(0,3).toUpperCase()||"—";
function crest(n,c,lg){
  return `<span class="crest ${lg?"lg":""}" style="background:${c||teamColor(n)}">${esc(ab(n))}</span>`;
}
function face(nombre,equipo){
  const ini=String(nombre).split(" ").filter(Boolean).map(w=>w[0]).slice(0,2).join("").toUpperCase();
  return `<span class="face" style="background:${teamColor(nombre)}">${esc(ini)}
    <i style="background:${teamColor(equipo)}">${esc(ab(equipo))}</i></span>`;
}

// ===== ANALISIS DEL MOTOR: markdown -> tarjetas =====
function motorAnalisisHTML(markdown){
  if(!markdown) return '<div class="empty"><b>Sin análisis</b></div>';
  let h=String(markdown).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  // convierte los PICK con confianza en tarjetas con barra
  function picks(txt){
    return txt.replace(/\*\*PICK:\*\*\s*(.+?)\s*·\s*\*\*Confianza:\*\*\s*(\d+)%?\s*\n?([^\n]*)/g,
      (m,pick,conf,razon)=>{
        const n=parseInt(conf);
        const col=n>=78?'var(--green)':(n>=68?'var(--amber)':'var(--dim2)');
        const lbl=n>=78?'Alta':(n>=68?'Media':'Baja');
        return `<div class="an-pick">
          <div class="an-pick-conf" style="color:${col}"><b>${conf}%</b><span>${lbl}</span></div>
          <div class="an-pick-body"><div class="an-pick-sel">${pick.trim()}</div>
          <div class="an-pick-why">${razon.trim()}</div>
          <div class="an-pick-bar"><i style="width:${Math.min(100,n)}%;background:${col}"></i></div></div>
        </div>`;
      });
  }
  const inline=t=>t
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/`(.+?)`/g,'<span class="mono">$1</span>')
    .replace(/^\s*[-*] (.+)$/gm,'<div class="an-li">$1</div>')
    .replace(/\n\n/g,'<br><br>').replace(/\n/g,'<br>');
  h=h.replace(/^# .+$/gm,'');
  const partes=h.split(/^## /gm);
  let out='';
  for(let k=1;k<partes.length;k++){
    const bloque=partes[k];
    const nl=bloque.indexOf('\n');
    const titulo=(nl<0?bloque:bloque.slice(0,nl)).trim();
    const cuerpo=(nl<0?'':bloque.slice(nl+1)).trim();
    const tl=titulo.toLowerCase();
    const tituloLimpio=titulo.replace(/[⭐🔥]/g,'').trim();

    // MODELOS (con picks de confianza) — encabezado de color
    if(titulo.includes('⭐')||tl.includes('conservador')){
      out+=`<div class="an-model an-model-cons">◆ ${esc(tituloLimpio)}</div>${picks(cuerpo).replace(/(?<!<\/div>)\n/g,'<br>')}`;continue;
    }
    if(titulo.includes('🔥')||tl.includes('estakazo')){
      out+=`<div class="an-model an-model-esta">◆ ${esc(tituloLimpio)}</div>${picks(cuerpo).replace(/(?<!<\/div>)\n/g,'<br>')}`;continue;
    }
    // LECTURA — tarjeta azul
    if(tl.includes('lectura')){
      out+=`<div class="an-sec sec-lectura"><div class="an-sec-t">📖 ${esc(tituloLimpio)}</div>
        <div class="an-sec-b">${inline(cuerpo)}</div></div>`;continue;
    }
    // VEREDICTO — ámbar destacado
    if(tl.includes('veredicto')){
      out+=`<div class="an-sec sec-veredicto"><div class="an-sec-t">⚖️ ${esc(tituloLimpio)}</div>
        <div class="an-sec-b">${inline(cuerpo)}</div></div>`;continue;
    }
    // RIESGO — rojo
    if(tl.includes('riesgo')){
      out+=`<div class="an-sec sec-riesgo"><div class="an-sec-t">⚠️ ${esc(tituloLimpio)}</div>
        <div class="an-sec-b">${inline(cuerpo)}</div></div>`;continue;
    }
    // DESCARTADOS / DERECHAS — colapsables (cerrados)
    if(tl.includes('descartado')||tl.includes('derecha')){
      const ic=tl.includes('descartado')?'🚫':'✔️';
      out+=`<div class="an-sec an-collapse closed" onclick="this.classList.toggle('closed')">
        <div class="an-sec-t">${ic} ${esc(tituloLimpio)} <span class="an-caret">▾</span></div>
        <div class="an-sec-b">${inline(cuerpo)}</div></div>`;continue;
    }
    // otra sección
    out+=`<div class="an-sec"><div class="an-sec-t">${esc(tituloLimpio)}</div>
      <div class="an-sec-b">${inline(cuerpo)}</div></div>`;
  }
  return out;
}
/* ===== SIDEBAR ===== */
const isMobile=()=>window.innerWidth<=820;
$("#tog").onclick=()=>{
  if(isMobile())document.body.classList.toggle("mopen");
  else{document.body.classList.toggle("collapsed");
    localStorage.setItem("sb",document.body.classList.contains("collapsed")?"1":"0");}
  $("#scrim").classList.toggle("on",document.body.classList.contains("mopen"));
};
$("#mtog").onclick=()=>{document.body.classList.add("mopen");$("#scrim").classList.add("on");};
$("#scrim").onclick=()=>{document.body.classList.remove("mopen");$("#scrim").classList.remove("on");};
if(localStorage.getItem("sb")==="1")document.body.classList.add("collapsed");
function syncMobile(){$("#mtog").style.display=isMobile()?"inline-flex":"none";}
window.addEventListener("resize",syncMobile);syncMobile();

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-v]"); if(!b)return;
  setView(b.dataset.v);
  if(isMobile()){document.body.classList.remove("mopen");$("#scrim").classList.remove("on");}
});

const TITLES={hoy:["Picks de hoy","Ordenados por ventaja"],parlays:["Parlays","Combinados por IA"],
  tabla:["Tabla de posiciones",""],jornada:["Jornadas",""],jugadores:["Jugadores",""],
  mios:["Mis picks","Los que marcaste como jugados"]};
function setView(v){
  window.setView=setView;
  view=v;
  document.querySelectorAll("[data-v]").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  $("#tbT").textContent=TITLES[v][0]; $("#tbS").textContent=TITLES[v][1];
  render();
}
function sbUser(){
  $("#sbuser").innerHTML = me
    ? `<span class="av">${esc((me.email||"?")[0].toUpperCase())}</span>
       <div class="sb-user-i"><b>${esc(me.email)}</b>
       ${isPro()?'<em>PRO</em>':'<em style="color:var(--dim2)">Cuenta gratis</em>'}</div>`
    : `<span class="av">?</span><div class="sb-user-i"><b>Sin sesión</b></div>`;
  $("#tbAct").innerHTML = me
    ? (isPro()?"":'<button class="btn btn-red" data-a="pro">Hazte PRO</button>')
      +'<button class="btn btn-line" data-a="out" style="margin-left:8px">Salir</button>'
    : '<button class="btn btn-red" data-a="in">Entrar</button>';
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]"); if(!b)return;
  const a=b.dataset.a;
  if(a==="in")openAuth("login"); if(a==="up")openAuth("register");
  if(a==="out")logout(); if(a==="pro")goPro();
});

/* ===== GATE ===== */
function gate(){
  // La landing ocupa toda la pantalla: sin sidebar ni topbar.
  document.body.classList.add("landing");
  $("#page").innerHTML=`
    <div class="land">
      <video class="land-vid" autoplay muted loop playsinline preload="metadata"
        poster="/media/estadio.jpg" aria-hidden="true">
        <source src="/media/estadio.mp4" type="video/mp4">
      </video>
      <div class="land-bg"></div>
      <div class="land-in">
        <div class="land-badge"><span class="d"></span> Acceso privado</div>
        <h1 class="land-h1">El que estudia cobra. El que adivina reza.</h1>
        <p class="land-p">Crea tu cuenta y activa PRO para desbloquear los picks del día,
          los parlays combinados por IA y el historial verificado.</p>
        <div class="land-grid">
          <div class="lc"><b>Ventaja matemática</b>
            <span>Solo picks donde la prob. real supera lo que paga la casa.</span></div>
          <div class="lc"><b>Parlays por IA</b>
            <span>Combinados armados con datos, no corazonada.</span></div>
          <div class="lc"><b>Historial verificado</b>
            <span>Cada pick se marca acierto o fallo, sin editar después.</span></div>
          <div class="lc"><b>Picks del día</b>
            <span>Solo los de mayor ventaja, filtrados antes de cada jornada.</span></div>
        </div>
        <button class="land-cta" data-a="up">Crear cuenta y empezar</button>
        <div class="land-sub" data-a="in">¿Ya tienes cuenta? <b>Entrar</b></div>
      </div>
    </div>`;
}

/* ===== RENDER ===== */
async function render(){
  if(!me){gate();return;}
  document.body.classList.remove("landing");
  const p=$("#page");
  p.innerHTML=`<div class="card"><div class="skel"></div><div class="skel" style="width:70%"></div>
    <div class="skel" style="width:85%"></div></div>`;
  try{
    if(view==="hoy")await viewHoy();
    else if(view==="parlays")await viewParlays();
    else if(view==="tabla")await viewTabla();
    else if(view==="jornada")await viewJornada();
    else if(view==="jugadores")await viewJugadores();
    else if(view==="mios")await viewMios();
  }catch(err){
    p.innerHTML=`<div class="card"><div class="empty"><b>No se pudo cargar</b>
      <span>Revisa tu conexión e intenta de nuevo.</span></div></div>`;
  }
}

/* --- HOY --- */
function pickCard(p){
  const voted=localStorage.getItem("v_"+p._id),mine=localStorage.getItem("m_"+p._id);
  const w=Math.min(100,Math.max(3,(p.edge/0.15)*100));
  return `<div class="pick">
    <div class="pick-h"><div><div class="pick-m">${esc(p.partido)}</div>
      <div class="pick-k">${esc(p.mercado)}</div></div>
      <span class="vd vd-${esc(p.verdicto)}">${esc(p.verdicto)}</span></div>
    <div class="ebar"><div class="efill" data-w="${w}"></div></div>
    <div class="enums">
      <div class="en"><div class="k">Ventaja</div><div class="v mono" style="color:var(--red)">+${pct(p.edge)}</div></div>
      <div class="en"><div class="k">Momio</div><div class="v mono">${dec(p.momio)}</div></div>
      <div class="en"><div class="k">Prob. real</div><div class="v mono">${pct(p.probEstimada)}</div></div>
      <div class="en"><div class="k">Paga</div><div class="v mono" style="color:var(--dim)">${pct(p.probImplicita)}</div></div>
    </div>
    ${p.analisis?`<p class="pnote">${esc(p.analisis)}</p>`:""}
    <div class="pft"><span style="font-size:12px;color:var(--dim)"><b style="color:var(--txt)">${p.votos}</b> votos</span>
      <div style="display:flex;gap:6px">
        <button class="sm ${mine?"on":""}" data-mine="${p._id}" ${mine?"disabled":""}>${mine?"✓ Lo jugué":"Lo jugué"}</button>
        <button class="sm ${voted?"on":""}" data-vote="${p._id}" ${voted?"disabled":""}>${voted?"✓ Votado":"Votar"}</button>
      </div></div></div>`;
}
function lockRow(p){
  return `<div class="lockrow"><div class="lk-b"><b>${esc(p.partido)}</b>
    <div class="lk-blur">Mercado y momio reservados</div></div>
    <div class="lk-e"><div class="k">Ventaja</div><div class="v mono">+${pct(p.edge)}</div></div>
    <button class="btn btn-red" data-a="pro">Desbloquear</button></div>`;
}
let JORNADA_SEL=null;  // null = auto (próximos)
async function viewHoy(){
  const liga=LIGA_ACTUAL;
  // MODO TODAS LAS LIGAS: partidos de todas juntas, sin selector de jornada
  if(liga==="__todas__"){
    const r=await fetch(`${API}/matches/todas`,{headers:H()});
    const partidos=await r.json().catch(()=>[]);
    const proximos=partidos.filter(p=>p.estado!=="finalizado");
    const jugados=partidos.filter(p=>p.estado==="finalizado").slice(0,20);
    $("#tbS").textContent=`${proximos.length} próximos · todas las ligas`;
    const cardT=(m,fin)=>{
      const hora=m.kickoff?new Date(m.kickoff).toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit",timeZone:TZ}):"";
      const vivo=m.enVivo||m.estado==="en_vivo";
      let centro=vivo?`<span class="jm-mid mono" style="color:var(--txt)">${m.golesLocal??0}-${m.golesVisitante??0}${m.minuto?`<span class="jm-min">⚡${esc(String(m.minuto))}'</span>`:""}</span>`
        :fin?`<span class="jm-mid mono sc">${m.golesLocal??"-"} - ${m.golesVisitante??"-"}</span>`:`<span class="jm-mid mono">${hora||"vs"}</span>`;
      let badge=vivo?`<span class="badge-live"><span class="dot-live"></span>EN VIVO</span>`:fin?`<span class="badge-fin">FINAL</span>`:`<span class="badge-liga">${esc(m.ligaNombre||m.liga||"")}</span>`;
      return `<div class="jm">
        <div class="jm-side"><span class="jm-name">${esc(m.local)}</span>${crest(m.local)}</div>
        ${centro}
        <div class="jm-side r">${crest(m.visitante)}<span class="jm-name">${esc(m.visitante)}</span></div>
        ${badge}
        ${!fin?`<button class="jm-an" data-partido="${esc(m._id)}">${vivo?"Ver":"Analizar"} →</button>`:""}
      </div>`;
    };
    // agrupar por día
    const by={};
    proximos.forEach(m=>{const k=m.kickoff?new Date(m.kickoff).toLocaleDateString("es-MX",{weekday:"long",day:"numeric",month:"long",timeZone:TZ}):"Por definir";(by[k]=by[k]||[]).push(m);});
    const grupos=Object.entries(by).map(([dia,ms])=>`<div class="jday">${esc(dia)}</div>${ms.map(m=>cardT(m,false)).join("")}`).join("");
    $("#page").innerHTML=`${ligaSelectorHTML()}
      <div class="card" style="margin-bottom:16px">
        <div class="card-h"><span class="card-t">Todas las ligas</span>
          <span class="card-s">próximos partidos</span></div>
        ${proximos.length?grupos:`<div class="empty"><b>No hay partidos próximos</b></div>`}
      </div>
      ${jugados.length?`<div class="card"><div class="card-h"><span class="card-t">Resultados</span>
        <span class="card-s">${jugados.length}</span></div>${jugados.map(m=>cardT(m,true)).join("")}</div>`:""}`;
    const hayVivo=proximos.some(m=>m.enVivo);
    clearTimeout(window._refreshHoy);
    if(hayVivo&&view==="hoy")window._refreshHoy=setTimeout(()=>{if(view==="hoy")viewHoy();},60000);
    return;
  }
  // traer jornadas (para el selector) y partidos en paralelo
  const [rp,rj]=await Promise.all([
    fetch(`${API}/matches?liga=${liga}&estado=todos`,{headers:H()}),
    fetch(`${API}/matches/jornadas-liga?liga=${liga}`,{headers:H()}).catch(()=>null)
  ]);
  const partidos=await rp.json().catch(()=>[]);
  const jdata=rj?await rj.json().catch(()=>({jornadas:[]})):{jornadas:[]};
  const jornadas=jdata.jornadas||[];

  // jornada por defecto: la "actual", o la primera próxima
  if(JORNADA_SEL===null){
    const actual=jornadas.find(j=>j.estado==="actual")||jornadas.find(j=>j.estado==="proxima");
    JORNADA_SEL=actual?actual.jornada:"__todas__";
  }

  // filtrar partidos por jornada seleccionada
  let lista=partidos;
  if(JORNADA_SEL&&JORNADA_SEL!=="__todas__"){
    lista=partidos.filter(p=>(p.jornada||"")===JORNADA_SEL);
  }
  const proximos=lista.filter(p=>p.estado!=="finalizado");
  const jugados=lista.filter(p=>p.estado==="finalizado");
  $("#tbS").textContent=`${proximos.length} próximos`;

  // agrupar por día
  function agrupaPorDia(arr){
    const by={};
    arr.forEach(m=>{
      const k=m.kickoff?new Date(m.kickoff).toLocaleDateString("es-MX",{weekday:"long",day:"numeric",month:"long",timeZone:TZ}):"Por definir";
      (by[k]=by[k]||[]).push(m);
    });
    return by;
  }

  const cardPartido=(m,fin)=>{
    const hora=m.kickoff?new Date(m.kickoff).toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit",timeZone:TZ}):"";
    const vivo=m.enVivo||m.estado==="en_vivo";
    let centro;
    if(vivo){centro=`<span class="jm-mid mono" style="color:var(--txt)">${m.golesLocal??0} - ${m.golesVisitante??0}${m.minuto?`<span class="jm-min">⚡ ${esc(String(m.minuto))}'</span>`:""}</span>`;}
    else if(fin){centro=`<span class="jm-mid mono sc">${m.golesLocal??"-"} - ${m.golesVisitante??"-"}</span>`;}
    else{centro=`<span class="jm-mid mono">${hora||"vs"}</span>`;}
    let badge="";
    if(vivo)badge=`<span class="badge-live"><span class="dot-live"></span>EN VIVO</span>`;
    else if(fin)badge=`<span class="badge-fin">FINAL</span>`;
    else if(m.kickoff&&fechaMX(m.kickoff)===hoyMX())badge=`<span class="badge-hoy">HOY</span>`;
    return `<div class="jm">
      <div class="jm-side"><span class="jm-name">${esc(m.local)}</span>${crest(m.local)}</div>
      ${centro}
      <div class="jm-side r">${crest(m.visitante)}<span class="jm-name">${esc(m.visitante)}</span></div>
      ${badge}
      ${!fin&&!vivo?`<button class="jm-an" data-partido="${esc(m._id)}">Analizar →</button>`:""}
      ${vivo?`<button class="jm-an" data-partido="${esc(m._id)}">Ver →</button>`:""}
    </div>`;
  };

  const grupoHTML=(arr,fin)=>{
    const by=agrupaPorDia(arr);
    return Object.entries(by).map(([dia,ms])=>`<div class="jday">${esc(dia)}</div>${ms.map(m=>cardPartido(m,fin)).join("")}`).join("");
  };

  // selector de jornadas (chips)
  const jornadaSelHTML=jornadas.length?`<div class="jornada-sel">
    ${jornadas.map(j=>`<button class="jor-chip ${JORNADA_SEL===j.jornada?"on":""}" data-jornada="${esc(j.jornada)}">
      ${esc(j.jornada)}${j.estado==="actual"?' <span class="jor-dot"></span>':""}</button>`).join("")}
    <button class="jor-chip ${JORNADA_SEL==="__todas__"?"on":""}" data-jornada="__todas__">Todas</button>
  </div>`:"";

  $("#page").innerHTML=`
    ${ligaSelectorHTML()}
    ${jornadaSelHTML}
    <div class="card" style="margin-bottom:16px">
      <div class="card-h"><span class="card-t">${JORNADA_SEL&&JORNADA_SEL!=="__todas__"?esc(JORNADA_SEL):"Próximos partidos"}</span>
        <span class="card-s">${LIGA_NOMBRES[liga]||liga} · toca Analizar</span></div>
      ${proximos.length?grupoHTML(proximos,false)
        :`<div class="empty"><b>No hay partidos próximos</b>
          <span>Prueba otra jornada o actualiza los datos con la extensión.</span></div>`}
    </div>
    ${jugados.length?`<div class="card">
      <div class="card-h"><span class="card-t">Resultados</span>
        <span class="card-s">${jugados.length} jugados</span></div>
      ${grupoHTML(jugados,true)}
    </div>`:""}`;

  const hayVivo=proximos.some(m=>m.enVivo||m.estado==="en_vivo");
  clearTimeout(window._refreshHoy);
  if(hayVivo&&view==="hoy"){window._refreshHoy=setTimeout(()=>{if(view==="hoy")viewHoy();},60000);}
}

function jmRow(m,conAnalisis){
  const fin=m.estado==="finalizado";
  const hora=m.kickoff?new Date(m.kickoff).toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit",timeZone:TZ}):"";
  // El _id del motor es "liga:local:visitante" (con : y espacios), que rompe
  // los selectores CSS. Usamos un id LIMPIO para el HTML y guardamos el real aparte.
  const safe="m"+Math.abs([...String(m._id)].reduce((a,c)=>(a*31+c.charCodeAt(0))|0,7));
  return `<div class="jm">
    <div class="jm-side"><span class="jm-name">${esc(m.local)}</span>${crest(m.local)}</div>
    <span class="jm-mid mono ${fin?"sc":""}">${fin?`${m.golesLocal} - ${m.golesVisitante}`:hora||"vs"}</span>
    <div class="jm-side r">${crest(m.visitante)}<span class="jm-name">${esc(m.visitante)}</span></div>
    ${conAnalisis&&!fin?`<button class="jm-an" data-an="${esc(m._id)}" data-box="${safe}">Analizar</button>`:""}
  </div><div id="an-${safe}"></div>`;
}

  const grupos=(ms)=>{
    const by={};
    ms.forEach(m=>{const k=m.kickoff?new Date(m.kickoff).toLocaleDateString("es-MX",
      {weekday:"long",day:"numeric",month:"long"}):m.fecha;(by[k]=by[k]||[]).push(m);});
    return Object.entries(by).map(([d,l])=>`<div class="jday">${esc(d)}</div>

  document.querySelectorAll("[data-v]").forEach(b=>b.classList.remove("on"));

        <div style="text-align:center">${crest(visitante,null,true)}

      </div>
    </div>
    <div class="card" style="margin-bottom:16px" id="pAnalisis">

    <div class="card" style="margin-bottom:16px" id="pAlineaciones">
      <div class="card-h"><span class="card-t">Alineaciones</span></div>
      <div class="skel"></div></div>
    <div class="grid2">
      <div class="card" id="pJugL"><div class="card-h"><span class="card-t">Top ${esc(local)}</span></div>
        <div class="skel"></div></div>
      <div class="card" id="pJugV"><div class="card-h"><span class="card-t">Top ${esc(visitante)}</span></div>
        <div class="skel"></div></div>
    </div>`;
  // Hero con marcador/estado en vivo (consulta el partido actual)
  window._cargarHero=()=>{
    fetch(`${API}/matches?liga=${liga}&estado=todos`,{headers:H()})
      .then(r=>r.json()).then(arr=>{
        const m=(arr||[]).find(x=>x._id===id);
        if(!m)return;
        const vivo=m.enVivo||m.estado==="en_vivo";
        const fin=m.estado==="finalizado";
        let centro,estado="";
        if(vivo){centro=`<div class="mono" style="font-size:32px;font-weight:900">${m.golesLocal??0} - ${m.golesVisitante??0}</div>`;
          estado=`<span class="badge-live" style="margin-top:6px"><span class="dot-live"></span>EN VIVO${m.minuto?` · ${esc(String(m.minuto))}'`:""}</span>`;}
        else if(fin){centro=`<div class="mono" style="font-size:32px;font-weight:900">${m.golesLocal??"-"} - ${m.golesVisitante??"-"}</div>`;
          estado=`<span class="badge-fin" style="margin-top:6px">FINAL</span>`;}
        else{const hora=m.kickoff?new Date(m.kickoff).toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit",timeZone:TZ}):"";
          centro=`<div style="color:var(--dim2);font-weight:800;font-size:16px">VS</div>`;
          estado=`<span style="font-size:12px;color:var(--dim);margin-top:6px">${hora}</span>`;}
        $("#pHero").innerHTML=`<div style="display:flex;align-items:center;justify-content:center;gap:22px;padding:22px">
          <div style="text-align:center">${crest(local,null,true)}
            <div style="font-weight:800;font-size:15px;margin-top:8px">${esc(local)}</div></div>
          <div style="display:flex;flex-direction:column;align-items:center">${centro}${estado}</div>
          <div style="text-align:center">${crest(visitante,null,true)}
            <div style="font-weight:800;font-size:15px;margin-top:8px">${esc(visitante)}</div></div>
        </div>`;
        // si está en vivo, refrescar el hero cada 60s
        clearTimeout(window._heroTimer);
        if(vivo&&view==="partido")window._heroTimer=setTimeout(()=>{if(view==="partido")window._cargarHero();},60000);
      }).catch(()=>{});
  };
  window._cargarHero();
  window._cargarAnalisis=(forzar)=>{
    $("#pAnalisis").innerHTML=`<div class="card-h"><span class="card-t">Análisis a fondo</span></div>
      <div class="skel"></div><div class="skel" style="width:75%"></div>`;
    fetch(`${API}/matches/analizar`,{method:"POST",headers:H(),body:JSON.stringify({id,forzar:!!forzar})})
      .then(r=>r.json()).then(d=>{
        $("#pAnalisis").innerHTML=`<div class="card-h"><span class="card-t">Análisis a fondo</span>
          <span class="card-s">${d.cacheado?"guardado":"actualizado"}</span>
          <button class="btn btn-line" style="margin-left:8px;padding:4px 9px;font-size:11px" onclick="window._cargarAnalisis(true)">↻ Refrescar</button></div>
          ${motorAnalisisHTML(d.analisisMarkdown||d.error||"Sin análisis")}`;
      }).catch(()=>{$("#pAnalisis").innerHTML=`<div class="empty"><b>No se pudo analizar</b></div>`;});
  };
  window._cargarAnalisis(false);
  // ALINEACIONES (probables siempre, confirmada ~1h antes)
  window._cargarAlineaciones=()=>{
    fetch(`${API}/matches/alineaciones`,{method:"POST",headers:H(),body:JSON.stringify({id})})
      .then(r=>r.json()).then(d=>{$("#pAlineaciones").innerHTML=alineacionesHTML(d,local,visitante,id);})
      .catch(()=>{$("#pAlineaciones").innerHTML=`<div class="card-h"><span class="card-t">Alineaciones</span></div>
        <div class="empty"><span>No disponibles ahora</span></div>`;});
  };
  window._cargarAlineaciones();
  // botón traer alineación de ESTE partido
  window._traerAlineacion=(btn)=>{
    if(btn){btn.disabled=true;btn.textContent="Trayendo…";}
    fetch(`${API}/matches/traer-alineacion`,{method:"POST",headers:H(),body:JSON.stringify({id})})
      .then(r=>r.json()).then(d=>{
        if(d.actualizados>0){window._cargarAlineaciones();}
        else{if(btn){btn.disabled=false;btn.textContent="🔄 Traer alineación";}
          const nota=$("#aliNota");if(nota)nota.textContent=d.nota||"Aún no disponible (se confirma ~1h antes)";}
      }).catch(()=>{if(btn){btn.disabled=false;btn.textContent="🔄 Traer alineación";}});
  };
  fetch(`${API}/matches/detalle`,{method:"POST",headers:H(),body:JSON.stringify({id})})
    .then(r=>r.json()).then(d=>{
      $("#pJugL").innerHTML=jugadoresCardHTML("Top "+local,(d.local&&d.local.jugadores)||[]);
      $("#pJugV").innerHTML=jugadoresCardHTML("Top "+visitante,(d.visitante&&d.visitante.jugadores)||[]);
    }).catch(()=>{});
}
function jugadoresCardHTML(titulo,jug){
  return `<div class="card-h"><span class="card-t">${esc(titulo)}</span></div>
    ${jug.length?jug.map(j=>`<div class="prow">
      ${face(j.nombre,j.equipo||"")}
      <div class="pinfo"><b>${esc(j.nombre)}</b>
        <span>${esc(j.posicion||"")}${j.partidos?` · ${j.partidos} PJ`:""}</span></div>
      <div class="pstat"><div class="v mono">${j.rating?Number(j.rating).toFixed(1):(j.goles||0)}</div>
        <div class="k">${j.rating?"Rating":"Goles"}</div></div>
    </div>`).join(""):`<div class="empty"><span>Sin datos de jugadores</span></div>`}`;
}
function alineacionesHTML(d,local,visitante,id){
  const btnTraer=`<button class="btn btn-line" style="padding:5px 11px;font-size:11px" onclick="window._traerAlineacion(this)">🔄 Traer alineación</button>`;
  if(!d||!d.hay){
    return `<div class="card-h"><span class="card-t">Alineaciones</span>
      <span class="card-s" style="margin-left:auto">${btnTraer}</span></div>
      <div class="empty"><span id="aliNota">${esc((d&&d.mensaje)||"Se publican ~1 hora antes del partido")}</span></div>`;
  }
  const badge=d.confirmada
    ? `<span class="ali-badge ali-conf">✓ CONFIRMADA</span>`
    : `<span class="ali-badge ali-prob">PROBABLE</span>`;
  const col=(eq)=>`
    <div class="ali-col">
      <div class="ali-team">${esc(eq.equipo)} ${eq.formacion?`<span class="ali-form">${esc(eq.formacion)}</span>`:""}</div>
      ${(eq.titulares||[]).length?(eq.titulares||[]).map(j=>`
        <div class="ali-p"><span class="ali-num mono">${esc(String(j.numero||j.dorsal||"·"))}</span>
        <span class="ali-name">${esc(j.nombre||j.name||j)}</span>
        ${j.posicion?`<span class="ali-pos">${esc(j.posicion)}</span>`:""}</div>`).join("")
        :`<div class="ali-empty">Sin confirmar aún</div>`}
    </div>`;
  return `<div class="card-h"><span class="card-t">Alineaciones</span>${badge}
    <span style="margin-left:auto">${btnTraer}</span></div>
    <div class="ali-grid">${col(d.local||{equipo:local})}${col(d.visitante||{equipo:visitante})}</div>`;
}

/* ===== ACCIONES ===== */
document.addEventListener("click",async e=>{
  // cambiar de liga
  const lg=e.target.closest("[data-liga]");
  if(lg){LIGA_ACTUAL=lg.dataset.liga;JORNADA_SEL=null;render();return;}
  // cambiar de jornada
  const jr=e.target.closest("[data-jornada]");
  if(jr){JORNADA_SEL=jr.dataset.jornada;viewHoy();return;}
  // abrir pantalla dedicada del partido
  const pt=e.target.closest("[data-partido]");
  if(pt){
    if(!isPro()){goPro();return;}
    abrirPartido(pt.dataset.partido);
    return;
  }
  const an=e.target.closest("[data-an]");
  if(an){
    if(!isPro()){goPro();return;}
    const id=an.dataset.an, box=$("#an-"+an.dataset.box);
    an.disabled=true;an.textContent="…";
    try{
      const r=await fetch(`${API}/matches/analizar`,{method:"POST",headers:H(),
        body:JSON.stringify({id:id})});
      const d=await r.json().catch(()=>({}));
      if(!r.ok){box.innerHTML=`<div style="padding:12px 16px;font-size:12.5px;color:var(--dim);
        border-bottom:1px solid var(--line)">${esc(d.error||"No se pudo analizar")}${d.usados!=null?` · ${d.usados}/${d.limite} hoy`:""}</div>`;
        an.disabled=false;an.textContent="Analizar";return;}
      box.innerHTML=`<div style="background:var(--panel2);border-bottom:1px solid var(--line)">
        <div style="padding:11px 16px;font-size:10px;font-weight:800;letter-spacing:.11em;
          text-transform:uppercase;color:var(--red)">Análisis Pickazo MX${d.nivel==="premium"?" · A fondo":""}${d.cacheado?" · guardado":""}</div>
        ${motorAnalisisHTML(d.analisisMarkdown||"")}
      </div>`;
      an.textContent="✓";
    }catch{an.disabled=false;an.textContent="Analizar";toast("Sin conexión");}
    return;
  }
  const bd=e.target.closest("[data-del]");
  if(bd){const r=await fetch(`${API}/history/${bd.dataset.del}`,{method:"DELETE",headers:H()});
    if(r.ok){toast("Eliminado","ok");viewMios();}return;}
  const bm=e.target.closest("[data-mine]");
  if(bm){
    const id=bm.dataset.mine;bm.disabled=true;
    try{const r=await fetch(`${API}/history/registrar`,{method:"POST",headers:H(),
        body:JSON.stringify({pickId:id})});
      const d=await r.json().catch(()=>({}));
      if(r.ok||r.status===409){localStorage.setItem("m_"+id,"1");
        bm.textContent="✓ Lo jugué";bm.classList.add("on");
        if(r.ok)toast("Guardado en tu historial","ok");}
      else{bm.disabled=false;toast(d.error||"No se pudo guardar");}
    }catch{bm.disabled=false;toast("Sin conexión");}
    return;
  }
  const bv=e.target.closest("[data-vote]");
  if(bv){
    const id=bv.dataset.vote;bv.disabled=true;
    try{const r=await fetch(`${API}/picks/${id}/vote`,{method:"POST",headers:H()});
      const d=await r.json().catch(()=>({}));
      if(r.ok||r.status===409){localStorage.setItem("v_"+id,"1");
        bv.textContent="✓ Votado";bv.classList.add("on");if(r.ok)toast("Voto registrado","ok");}
      else{bv.disabled=false;toast(d.error||"No se pudo votar");}
    }catch{bv.disabled=false;toast("Sin conexión");}
  }
});

async function goPro(){
  if(!me){openAuth("register");return;}
  try{const r=await fetch(`${API}/payments/checkout`,{method:"POST",headers:H()});
    const d=await r.json().catch(()=>({}));
    if(d.url){location.href=d.url;return;}
    toast(r.status===503?"Los pagos aún no están activos":"No se pudo abrir el pago");
  }catch{toast("Sin conexión");}
}
function openAuth(m){
  mode=m;
  // Restaurar el modal por si venia del flujo de recuperacion
  $("#mEmail").parentElement.style.display="";
  $("#mPass").parentElement.style.display="";
  $("#mGo").style.display="";$("#mGo").disabled=false;
  document.querySelectorAll(".mnote").forEach(n=>n.remove());
  $("#mSw").onclick=()=>openAuth(mode==="login"?"register":"login");
  $("#mT").textContent=m==="login"?"Entrar":"Crear cuenta";
  $("#mS").textContent=m==="login"?"Accede a la tabla, jornadas y picks del día."
    :"Gratis. Incluye tabla, jornadas, jugadores y el pick del día.";
  $("#mGo").textContent=m==="login"?"Entrar":"Crear cuenta";
  $("#mSw").innerHTML=m==="login"?'¿Primera vez? <b>Crear cuenta</b>':'¿Ya tienes cuenta? <b>Entrar</b>';
  $("#mForgot").style.display=m==="login"?"block":"none";
  $("#mE").textContent="";$("#mod").classList.add("on");
  setTimeout(()=>$("#mEmail").focus(),80);
}
$("#mSw").onclick=()=>openAuth(mode==="login"?"register":"login");

// --- Recuperar contraseña ---
$("#mForgot").onclick=()=>{
  $("#mT").textContent="Recuperar contraseña";
  $("#mS").textContent="Te mandamos un enlace para elegir una nueva.";
  $("#mE").textContent="";
  $("#mPass").parentElement.style.display="none";
  $("#mGo").textContent="Enviar enlace";
  $("#mSw").innerHTML='¿Ya la recordaste? <b>Entrar</b>';
  $("#mSw").onclick=()=>{ $("#mPass").parentElement.style.display="";
    $("#mSw").onclick=()=>openAuth(mode==="login"?"register":"login");
    openAuth("login"); };
  $("#mForgot").style.display="none";
  mode="forgot";
  setTimeout(()=>$("#mEmail").focus(),80);
};
$("#mod").onclick=e=>{if(e.target.id==="mod")$("#mod").classList.remove("on")};
document.addEventListener("keydown",e=>{
  if(e.key==="Escape")$("#mod").classList.remove("on");
  if(e.key==="Enter"&&$("#mod").classList.contains("on"))$("#mGo").click();
});
$("#mGo").onclick=async()=>{
  const email=$("#mEmail").value.trim(),password=$("#mPass").value;

  // Recuperar contraseña: solo pide el correo
  if(mode==="forgot"){
    if(!email||!email.includes("@")){$("#mE").textContent="Escribe un correo válido.";return;}
    $("#mGo").disabled=true;$("#mGo").textContent="Enviando…";
    try{
      const r=await fetch(`${API}/auth/forgot`,{method:"POST",
        headers:{"Content-Type":"application/json"},body:JSON.stringify({email})});
      const d=await r.json().catch(()=>({}));
      if(r.ok){
        $("#mT").textContent="Revisa tu correo";
        $("#mS").textContent="";
        $("#mE").textContent="";
        $("#mEmail").parentElement.style.display="none";
        $("#mGo").style.display="none";
        $("#mSw").innerHTML='<b>Volver a entrar</b>';
        const nota=document.createElement("div");
        nota.className="mnote";
        nota.textContent=d.mensaje||"Si ese correo tiene cuenta, te enviamos el enlace.";
        $("#mE").after(nota);
      }else{
        $("#mE").textContent=d.error||"No se pudo enviar.";
        $("#mGo").disabled=false;$("#mGo").textContent="Enviar enlace";
      }
    }catch{
      $("#mE").textContent="Sin conexión.";
      $("#mGo").disabled=false;$("#mGo").textContent="Enviar enlace";
    }
    return;
  }

  if(!email||!password){$("#mE").textContent="Escribe tu correo y contraseña.";return;}
  if(mode==="register"&&password.length<8){$("#mE").textContent="Mínimo 8 caracteres.";return;}
  $("#mGo").disabled=true;$("#mGo").textContent="Un momento…";
  try{
    const r=await fetch(`${API}/auth/${mode}`,{method:"POST",
      headers:{"Content-Type":"application/json"},body:JSON.stringify({email,password})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){$("#mE").textContent=d.error||"No se pudo completar.";return;}
    token=d.token;me=d.user;
    localStorage.setItem("token",token);localStorage.setItem("me",JSON.stringify(me));
    $("#mod").classList.remove("on");
    toast(mode==="login"?"Bienvenido de vuelta":"Cuenta creada","ok");
    sbUser();render();
  }catch{$("#mE").textContent="Sin conexión.";}
  finally{$("#mGo").disabled=false;$("#mGo").textContent=mode==="login"?"Entrar":"Crear cuenta";}
};
function logout(){
  token=null;me=null;localStorage.removeItem("token");localStorage.removeItem("me");
  view="hoy";
  document.querySelectorAll("[data-v]").forEach(b=>b.classList.toggle("on",b.dataset.v==="hoy"));
  sbUser();gate();toast("Sesión cerrada");
}

sbUser();render();
</script>
