services:
  backend:
    build: ./backend
    ports:
      - "3131:3131"
    env_file:
      - .env
    volumes:
      - ./chroma_data:/data/chroma
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3131/salud', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
