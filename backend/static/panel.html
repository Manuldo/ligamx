<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel · Motor Pickazo MX</title>
<style>
:root{--bg:#0e0f13;--panel:#15171d;--panel2:#1b1e26;--panel3:#232733;--txt:#eceef4;
  --dim:#8d93a3;--dim2:#5f6474;--line:#252935;--red:#ec3013;--green:#22c55e;--amber:#f0b429;--blue:#3b82f6;}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,sans-serif;padding:0}
.gate{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:24px;max-width:440px;margin:80px auto}
.gate h2{font-size:17px;margin-bottom:12px}
input,select,textarea{background:var(--bg);border:1px solid var(--line);color:var(--txt);padding:9px 11px;border-radius:8px;font-size:13px;font-family:inherit}
input[type=password]{width:100%;font-family:monospace;margin-bottom:12px}
.btn{background:var(--red);color:#fff;border:none;padding:9px 15px;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer}
.btn-line{background:var(--panel3);border:1px solid var(--line);color:var(--dim)}
.btn-sm{padding:4px 9px;font-size:11.5px;border-radius:6px}
.btn-danger{background:#3a1410;color:var(--red);border:1px solid var(--red)}
.layout{display:flex;min-height:100vh}
.side{width:230px;background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;flex-shrink:0}
.side h1{font-size:15px;font-weight:900;margin-bottom:3px}.side h1 span{color:var(--red)}
.side .sub{font-size:11px;color:var(--dim2);margin-bottom:18px}
.col-item{display:flex;justify-content:space-between;align-items:center;padding:9px 11px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--dim);margin-bottom:3px}
.col-item:hover{background:var(--panel3)}
.col-item.on{background:var(--panel3);color:var(--txt);font-weight:700}
.col-item .n{font-size:11px;color:var(--dim2);font-family:monospace}
.main{flex:1;padding:22px;overflow-x:auto}
.head{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.head h2{font-size:19px;font-weight:900}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.count{color:var(--dim);font-size:12.5px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;padding:8px 10px;color:var(--dim2);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg)}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr:hover{background:var(--panel2)}
.chk{width:16px;height:16px;cursor:pointer}
.row-actions{display:flex;gap:5px}
.msg{padding:8px 0;font-size:13px}
.ok{color:var(--green)}.err{color:var(--red)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50}
.modal.open{display:flex}
.modal-box{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:20px;width:520px;max-width:92vw;max-height:86vh;overflow-y:auto}
.modal-box h3{font-size:15px;margin-bottom:14px}
.fld{margin-bottom:10px}
.fld label{display:block;font-size:11px;color:var(--dim2);margin-bottom:3px;font-weight:700}
.fld input,.fld textarea{width:100%}
.fld textarea{min-height:60px;font-family:monospace;font-size:12px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.bulkbar{background:var(--panel2);border:1px solid var(--amber);border-radius:9px;padding:8px 12px;margin-bottom:12px;display:none;align-items:center;gap:12px;font-size:13px}
.bulkbar.open{display:flex}
.pill{background:var(--panel3);padding:2px 8px;border-radius:10px;font-size:10px;color:var(--dim2);font-family:monospace}
</style>
</head>
<body>

<div id="gate" class="gate">
  <h2>Panel del Motor</h2>
  <p style="font-size:13px;color:var(--dim);margin-bottom:14px">Ingresa el <b>PICKAZO_BRIDGE_KEY</b> del motor.</p>
  <input type="password" id="key" placeholder="PICKAZO_BRIDGE_KEY" autocomplete="off">
  <button class="btn" style="width:100%" onclick="entrar()">Entrar</button>
  <div class="err" id="gerr" style="margin-top:8px"></div>
</div>

<div id="app" class="layout" style="display:none">
  <div class="side">
    <h1>PICKAZO <span>MX</span></h1>
    <div class="sub">Panel del motor</div>
    <div id="cols"></div>
  </div>
  <div class="main">
    <div class="head">
      <h2 id="colTitle">—</h2>
      <span class="count" id="count"></span>
    </div>
    <div class="tools">
      <input id="q" placeholder="Buscar…" style="width:220px" onkeydown="if(event.key==='Enter')cargar()">
      <input id="ligaF" placeholder="Liga (opcional)" style="width:130px" onkeydown="if(event.key==='Enter')cargar()">
      <button class="btn btn-line btn-sm" onclick="cargar()">Buscar</button>
      <button class="btn btn-line btn-sm" onclick="$('#q').value='';$('#ligaF').value='';cargar()">Limpiar</button>
      <button class="btn btn-sm" style="background:#2a1e05;color:var(--amber);border:1px solid var(--amber)" onclick="detectarIntrusos()">🔍 Detectar equipos intrusos</button>
      <button class="btn btn-sm" style="background:#0d2818;color:#22c55e;border:1px solid #22c55e" onclick="dedupClasificacion()">🧹 Fusionar duplicados (tabla)</button>
      <button class="btn btn-sm" style="background:#0a1e2a;color:#3b82f6;border:1px solid #3b82f6" onclick="registrarPicks()">💾 Guardar picks del día</button>
    </div>
    <div class="bulkbar" id="bulkbar">
      <span><b id="bulkN">0</b> seleccionados</span>
      <button class="btn btn-danger btn-sm" onclick="borrarSeleccion()">Borrar seleccionados</button>
      <button class="btn btn-line btn-sm" onclick="deseleccionar()">Cancelar</button>
    </div>
    <div class="msg" id="msg"></div>
    <div style="overflow-x:auto"><table id="tabla"></table></div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <h3 id="modalTitle">Editar registro</h3>
    <div id="modalFields"></div>
    <div class="modal-actions">
      <button class="btn btn-line" onclick="cerrarModal()">Cancelar</button>
      <button class="btn" onclick="guardarEdit()">Guardar cambios</button>
    </div>
  </div>
</div>

<script>
let TOKEN="",COL="",DOCS=[],SEL=new Set(),EDIT_ID=null;
const $=s=>document.querySelector(s);
function entrar(){
  TOKEN=$("#key").value.trim();
  if(!TOKEN){$("#gerr").textContent="Ingresa el token";return;}
  sessionStorage.setItem("motor_token",TOKEN);
  init();
}
function hdr(){return{"Authorization":"Bearer "+TOKEN,"Content-Type":"application/json"};}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

async function init(){
  try{
    const r=await fetch("/admin/colecciones",{headers:hdr()});
    if(r.status===401||r.status===403||r.status===503){$("#gerr").textContent="Token incorrecto o no configurado";return;}
    const d=await r.json();
    $("#gate").style.display="none";$("#app").style.display="flex";
    $("#cols").innerHTML=(d.colecciones||[]).map(c=>
      `<div class="col-item" data-col="${c.col}" onclick="seleccionCol('${c.col}','${esc(c.label)}')">
        <span>${esc(c.label)}</span><span class="n">${c.total}</span></div>`).join("");
    if(d.colecciones&&d.colecciones.length)seleccionCol(d.colecciones[0].col,d.colecciones[0].label);
  }catch(e){$("#gerr").textContent="Error de conexión";}
}

function seleccionCol(col,label){
  COL=col;SEL.clear();actBulk();
  document.querySelectorAll(".col-item").forEach(el=>el.classList.toggle("on",el.dataset.col===col));
  $("#colTitle").textContent=label;
  cargar();
}

async function cargar(){
  if(!COL)return;
  $("#tabla").innerHTML='<tr><td style="color:var(--dim);padding:20px">Cargando…</td></tr>';
  const q=encodeURIComponent($("#q").value.trim()),liga=encodeURIComponent($("#ligaF").value.trim());
  try{
    const r=await fetch(`/admin/col?col=${COL}&q=${q}&liga=${liga}&limite=200`,{headers:hdr()});
    const d=await r.json();
    if(!d.ok){$("#tabla").innerHTML=`<tr><td class="err" style="padding:20px">${esc(d.error||"Error")}</td></tr>`;return;}
    DOCS=d.docs||[];SEL.clear();actBulk();
    $("#count").textContent=`${DOCS.length} registros`;
    render();
  }catch(e){$("#tabla").innerHTML='<tr><td class="err" style="padding:20px">Error de conexión</td></tr>';}
}

function render(){
  if(!DOCS.length){$("#tabla").innerHTML='<tr><td style="color:var(--dim2);padding:20px">Sin registros.</td></tr>';return;}
  // columnas: unión de las claves más comunes (excluye _id del header visible)
  const claves=[];
  DOCS.slice(0,20).forEach(d=>Object.keys(d).forEach(k=>{if(k!=="_id"&&!claves.includes(k))claves.push(k);}));
  const cols=claves.slice(0,7); // máximo 7 columnas visibles
  let html=`<thead><tr><th style="width:26px"><input type="checkbox" class="chk" onclick="todos(this)"></th>`;
  cols.forEach(c=>html+=`<th>${esc(c)}</th>`);
  html+=`<th style="width:120px">Acciones</th></tr></thead><tbody>`;
  DOCS.forEach(d=>{
    html+=`<tr><td><input type="checkbox" class="chk" data-id="${d._id}" onclick="toggleSel('${d._id}',this)"></td>`;
    cols.forEach(c=>{
      let v=d[c];
      if(v&&typeof v==="object")v=JSON.stringify(v);
      html+=`<td title="${esc(v)}">${esc(v)}</td>`;
    });
    html+=`<td><div class="row-actions">
      <button class="btn btn-line btn-sm" onclick="abrirEdit('${d._id}')">Editar</button>
      <button class="btn btn-danger btn-sm" onclick="borrarUno('${d._id}')">Borrar</button>
    </div></td></tr>`;
  });
  html+=`</tbody>`;
  $("#tabla").innerHTML=html;
}

function todos(chk){document.querySelectorAll('[data-id]').forEach(c=>{c.checked=chk.checked;const id=c.dataset.id;if(chk.checked)SEL.add(id);else SEL.delete(id);});actBulk();}
function toggleSel(id,chk){if(chk.checked)SEL.add(id);else SEL.delete(id);actBulk();}
function deseleccionar(){SEL.clear();document.querySelectorAll('.chk').forEach(c=>c.checked=false);actBulk();}
function actBulk(){$("#bulkbar").classList.toggle("open",SEL.size>0);$("#bulkN").textContent=SEL.size;}

async function borrarUno(id){
  if(!confirm("¿Borrar este registro?"))return;
  const r=await fetch("/admin/col/borrar",{method:"POST",headers:hdr(),body:JSON.stringify({col:COL,id})});
  const d=await r.json();
  if(d.ok){msg("✓ Registro borrado","ok");cargar();}else msg(d.error||"No se pudo","err");
}
async function borrarSeleccion(){
  if(!SEL.size)return;
  if(!confirm(`¿Borrar ${SEL.size} registros seleccionados?`))return;
  const r=await fetch("/admin/col/borrar_varios",{method:"POST",headers:hdr(),body:JSON.stringify({col:COL,ids:[...SEL]})});
  const d=await r.json();
  if(d.ok){msg(`✓ ${d.borrados} registros borrados`,"ok");cargar();}else msg(d.error||"No se pudo","err");
}

function abrirEdit(id){
  const doc=DOCS.find(d=>d._id===id);if(!doc)return;
  EDIT_ID=id;
  $("#modalTitle").textContent="Editar registro";
  const campos=Object.keys(doc).filter(k=>k!=="_id");
  $("#modalFields").innerHTML=campos.map(k=>{
    let v=doc[k];const esObj=v&&typeof v==="object";
    if(esObj)v=JSON.stringify(v,null,2);
    const input=esObj?`<textarea data-k="${esc(k)}" data-obj="1">${esc(v)}</textarea>`
      :`<input data-k="${esc(k)}" value="${esc(v)}">`;
    return `<div class="fld"><label>${esc(k)}</label>${input}</div>`;
  }).join("");
  $("#modal").classList.add("open");
}
function cerrarModal(){$("#modal").classList.remove("open");EDIT_ID=null;}

async function guardarEdit(){
  const campos={};
  document.querySelectorAll("#modalFields [data-k]").forEach(el=>{
    let v=el.value;
    if(el.dataset.obj){try{v=JSON.parse(v);}catch{}}
    else if(/^-?\d+$/.test(v.trim()))v=parseInt(v);
    else if(/^-?\d*\.\d+$/.test(v.trim()))v=parseFloat(v);
    campos[el.dataset.k]=v;
  });
  const r=await fetch("/admin/col/editar",{method:"POST",headers:hdr(),body:JSON.stringify({col:COL,id:EDIT_ID,campos})});
  const d=await r.json();
  if(d.ok){msg("✓ Cambios guardados","ok");cerrarModal();cargar();}else msg(d.error||"No se pudo","err");
}

function msg(t,cls){$("#msg").innerHTML=`<span class="${cls}">${t}</span>`;setTimeout(()=>{$("#msg").innerHTML="";},6000);}

// Detecta equipos que no pertenecen a la liga (scraper equivocado).
async function registrarPicks(){
  msg("Guardando picks del día…","");
  try{
    const [r1,r2]=await Promise.all([
      fetch("/admin/registrar_picks",{method:"POST",headers:hdr()}),
      fetch("/admin/estado_track",{headers:hdr()})
    ]);
    const d1=await r1.json(); const d2=await r2.json();
    if(d1.ok){
      msg(`✓ ${d1.picks_registrados} picks guardados · Track: ${d2.total||0} totales, ${d2.pendientes||0} pendientes, ${d2.resueltos||0} resueltos`,"ok");
    }else msg(d1.error||"No se pudo","err");
  }catch(e){msg("Error de conexión","err");}
}

async function dedupClasificacion(){
  const liga=prompt("¿En qué liga fusionar duplicados de la tabla? (ligamx, laliga, premier…)","ligamx");
  if(!liga)return;
  msg("Buscando duplicados…","");
  try{
    // primero solo ver
    const rv=await fetch("/admin/dedup_clasificacion",{method:"POST",headers:hdr(),body:JSON.stringify({liga,solo_ver:true})});
    const dv=await rv.json();
    if(!dv.ok){msg(dv.error||"Error","err");return;}
    if(!dv.grupos_duplicados){msg(`✓ Sin duplicados en ${liga}`,"ok");return;}
    const lista=dv.detalle.map(x=>"• "+x.duplicados.join(" = ")+" → se queda: "+x.se_queda).join("\n");
    if(confirm(`Se encontraron ${dv.grupos_duplicados} equipos duplicados en ${liga}:\n\n${lista}\n\n¿Fusionar? (se queda el registro con más partidos, se borra el otro)`)){
      const r=await fetch("/admin/dedup_clasificacion",{method:"POST",headers:hdr(),body:JSON.stringify({liga,solo_ver:false})});
      const d=await r.json();
      if(d.ok){msg(`✓ ${d.borrados} duplicados fusionados en ${liga}`,"ok");cargar();}
      else msg(d.error||"No se pudo","err");
    }
  }catch(e){msg("Error de conexión","err");}
}

async function detectarIntrusos(){
  const soportadas={partidos:1,clasificacion:1,jugadores:1};
  if(!soportadas[COL]){msg("Detección disponible en: Partidos, Clasificación, Jugadores","err");return;}
  const liga=prompt("¿En qué liga buscar intrusos? (ej. laliga, premier, ligamx)","laliga");
  if(!liga)return;
  msg("Buscando intrusos…","");
  try{
    const r=await fetch(`/admin/detectar_intrusos?liga=${encodeURIComponent(liga)}&col=${COL}`,{headers:hdr()});
    const d=await r.json();
    if(!d.ok){msg(d.error||"Error","err");return;}
    if(!d.intrusos.length){msg(`✓ Sin intrusos en ${liga} (${d.total_revisados} revisados)`,"ok");return;}
    const nombres=d.intrusos.map(i=>i.equipo).join(", ");
    if(confirm(`Se encontraron ${d.intrusos.length} equipos que NO son de ${liga}:\n\n${nombres}\n\n¿Borrarlos todos? (los de ${liga} se quedan intactos)`)){
      const ids=d.intrusos.map(i=>i.id);
      const r2=await fetch("/admin/limpiar_intrusos",{method:"POST",headers:hdr(),body:JSON.stringify({liga,col:COL,ids})});
      const d2=await r2.json();
      if(d2.ok){msg(`✓ ${d2.borrados} equipos intrusos borrados de ${liga}`,"ok");cargar();}
      else msg(d2.error||"No se pudo","err");
    }
  }catch(e){msg("Error de conexión","err");}
}

if(sessionStorage.getItem("motor_token")){TOKEN=sessionStorage.getItem("motor_token");init();}
</script>
</body>
</html>
